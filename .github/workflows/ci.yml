name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Cancel outdated PR checks; retain checks for each main or manual commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify toolchain
        run: |
          source Scripts/toolchain.sh
          xcodebuild -version
          swift --version
          test "$(uname -m)" = arm64
      - name: Require a manually increased repository version
        env:
          VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$VERSION_BASE" ]; then
            python3 Scripts/release_version.py --check-increase "$VERSION_BASE"
          else
            python3 Scripts/release_version.py
          fi
      - name: Test release versioning
        run: python3 -m unittest discover -s Scripts -p 'test_*.py' -v
      - name: Run Swift unit tests
        run: swift test
      - name: Run regression, menu and UI checks
        run: bash Scripts/check.sh
      - name: Check icon appearance
        run: bash Scripts/check-icons.sh
      - name: Build and verify app with embedded widget
        run: bash Scripts/build-local.sh
      - name: Verify Xcode uses the same version source
        run: |
          python3 Scripts/generate_project.py
          git diff --exit-code -- LLMUsage.xcodeproj
          xcodebuild -project LLMUsage.xcodeproj -scheme LLMUsage -configuration Debug \
            -derivedDataPath build/XcodeVersionCheck CODE_SIGNING_ALLOWED=NO build
          python3 Scripts/build_version.py --verify-bundle \
            'build/XcodeVersionCheck/Build/Products/Debug/LLM Usage.app' --with-widget
      - name: Verify bundled native CLI against synthetic pricing fixtures
        run: |
          python3 Scripts/check-claude-streams.py
          build/portable-checks --bundled-cli
      - name: Exercise signed app updates and download-only policy
        run: bash Scripts/check-updates.sh
