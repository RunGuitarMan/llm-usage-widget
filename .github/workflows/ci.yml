name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel outdated PR checks, but preserve every main commit's release run.
# Different main commits have independent groups and deterministic version numbers.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          source Scripts/toolchain.sh
          xcodebuild -version
          swift --version
          test "$(uname -m)" = arm64
      - name: Validate release type in PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 Scripts/release_version.py --check-title "$PR_TITLE"
      - name: Test release versioning
        run: python3 -m unittest discover -s Scripts -p 'test_*.py' -v
      - name: Run Swift unit tests
        run: swift test
      - name: Run regression, menu and UI checks
        run: bash Scripts/check.sh
      - name: Check icon appearance
        run: bash Scripts/check-icons.sh
      - name: Build and verify app with embedded widget
        run: bash Scripts/build-local.sh
      - name: Compile private UI review mode
        run: bash Scripts/manual-review.sh --build-only

  release:
    name: Release
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out tested commit and full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate version
        id: version
        run: python3 Scripts/release_version.py --github-output
      - name: Build versioned app
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}
        run: |
          test "$(uname -m)" = arm64
          bash Scripts/build-local.sh
      - name: Package app and checksum
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent \
            'build/LLM Usage.app' "build/release/LLM-Usage-${RELEASE_TAG}-macOS-arm64.zip"
          cd build/release
          shasum -a 256 ./*.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 Scripts/publish_release.py
